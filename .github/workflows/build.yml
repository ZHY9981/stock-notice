name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Rule engine tests
        shell: pwsh
        run: ./tools/run-tests.ps1

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: StockNotice
          path: build/StockNotice.exe
          if-no-files-found: error
