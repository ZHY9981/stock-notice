<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #dfe5ee; font-family: "Microsoft YaHei UI","Microsoft YaHei","Segoe UI",sans-serif; color: #18202C; }
  .wrap { width: 1280px; height: 800px; background: #F5F7FA; display: flex; flex-direction: column; overflow: hidden; }
  .titlebar { height: 30px; background: #f3f3f3; display: flex; align-items: center; padding: 0 10px; gap: 8px; color: #333; font-size: 12px; border-bottom: 1px solid #e2e2e2; }
  .titlebar .dot { width: 14px; height: 14px; border-radius: 50%; background: #1f2937; color: #fff; font-size: 9px; display: flex; align-items: center; justify-content: center; }
  .titlebar .spacer { margin-left: auto; letter-spacing: 10px; color: #666; }

  .header { background: #111827; color: #fff; display: flex; align-items: center; padding: 0 20px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 34px; height: 34px; border-radius: 9px; background: #1E293B; border: 1px solid #2B3A55; display: flex; align-items: center; justify-content: center; color: #93B4FF; font-weight: 800; font-size: 14px; }
  .brand h1 { font-size: 17px; font-weight: 700; }
  .brand p { font-size: 10px; color: #8C9AB3; margin-top: 2px; }
  .chip { border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
  .chip.muted { background: #1F2937; color: #B9C2D0; border: 1px solid #334155; }
  .chip.ok { background: #14352C; color: #7EF0B8; border: 1px solid #245B47; }
  .chip.warn { background: #3A2327; color: #FF8E8E; border: 1px solid #5B333A; }
  .spacer { flex: 1; }
  .hbtn { border: 1px solid #3A4557; background: #182130; color: #E5E7EB; border-radius: 6px; padding: 7px 14px; font-size: 12px; font-weight: 700; }
  .hbtn.primary { background: #3B6FF5; border-color: #3B6FF5; color: #fff; }

  .toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 20px; background: #F5F7FA; }
  .btn { border-radius: 6px; padding: 7px 14px; font-size: 12px; font-weight: 600; border: 1px solid #D5DCE6; background: #fff; color: #344054; }
  .btn.primary { background: #3B6FF5; color: #fff; border-color: #3B6FF5; }
  .hint { margin-left: auto; color: #98A2B3; font-size: 11px; }

  .card { background: #fff; border: 1px solid #E3E8EF; border-radius: 8px; }

  .up { color: #D33A3A; } .down { color: #078552; } .muted { color: #98A2B3; } .mid { color: #475467; }

  /* ---------- A: compact terminal ---------- */
  .a-header { height: 64px; }
  .a-metrics { display: flex; gap: 26px; margin-left: 28px; }
  .a-metric b { display: block; font-size: 16px; }
  .a-metric span { font-size: 10px; color: #8C9AB3; }
  .a-body { flex: 1; display: flex; gap: 12px; padding: 12px 20px 0; min-height: 0; }
  .a-left { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .a-table { overflow: hidden; }
  .a-table table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .a-table th { text-align: left; font-size: 11px; color: #98A2B3; font-weight: 600; padding: 8px 12px; background: #F8FAFC; border-bottom: 1px solid #E3E8EF; }
  .a-table td { padding: 9px 12px; border-bottom: 1px solid #F1F4F8; }
  .a-table tr.sel td { background: #EAF0FF; }
  .a-log { flex: 1; overflow: hidden; }
  .a-log h3 { font-size: 12px; color: #475467; padding: 10px 14px 6px; }
  .logrow { display: flex; gap: 10px; align-items: center; padding: 7px 14px; border-top: 1px solid #F1F4F8; font-size: 12px; }
  .a-detail { width: 380px; display: flex; flex-direction: column; gap: 10px; }
  .d-head { padding: 14px 16px 8px; }
  .d-name { font-size: 20px; font-weight: 800; }
  .d-code { font-size: 11px; color: #98A2B3; margin-top: 2px; }
  .d-price { font-size: 34px; font-weight: 800; margin-top: 6px; }
  .d-chg { font-size: 12px; font-weight: 700; margin-top: 2px; }
  .d-chart { height: 130px; background: #F8FAFC; border: 1px solid #EEF2F7; border-radius: 6px; margin: 8px 16px; position: relative; }
  .d-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; padding: 4px 16px 0; font-size: 12px; }
  .d-grid b { font-size: 13px; }
  .d-actions { margin-top: auto; padding: 12px 16px; display: flex; gap: 8px; }

  /* ---------- B: dashboard ---------- */
  .b-header { height: 128px; align-items: center; }
  .b-hero { display: flex; align-items: center; gap: 34px; width: 100%; }
  .b-big { font-size: 30px; font-weight: 800; line-height: 1.1; }
  .b-sub { font-size: 12px; color: #8C9AB3; margin-top: 6px; }
  .b-stat { text-align: left; }
  .b-stat b { display: block; font-size: 22px; }
  .b-stat span { font-size: 10px; color: #8C9AB3; }
  .b-body { flex: 1; display: flex; gap: 12px; padding: 14px 20px 0; min-height: 0; }
  .b-list { flex: 1; overflow: hidden; }
  .b-list table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .b-list th { text-align: left; font-size: 11px; color: #98A2B3; padding: 9px 14px; background: #F8FAFC; border-bottom: 1px solid #E3E8EF; }
  .b-list td { padding: 11px 14px; border-bottom: 1px solid #F1F4F8; }
  .b-side { width: 400px; display: flex; flex-direction: column; gap: 12px; }
  .gauge { margin: 10px 16px; }
  .gauge .row { display: flex; justify-content: space-between; font-size: 11px; color: #667085; margin-bottom: 4px; }
  .bar { height: 8px; border-radius: 5px; background: #EEF2F7; position: relative; overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }

  /* ---------- C: detail first ---------- */
  .c-body { flex: 1; display: flex; padding: 12px 20px 0; gap: 12px; min-height: 0; }
  .c-rail { width: 250px; overflow: hidden; }
  .railrow { display: flex; justify-content: space-between; align-items: center; padding: 12px 12px; border-bottom: 1px solid #F1F4F8; }
  .railrow.sel { background: #EAF0FF; border-left: 3px solid #3B6FF5; padding-left: 9px; }
  .railrow .n { font-size: 12.5px; font-weight: 600; }
  .railrow .c { font-size: 10px; color: #98A2B3; margin-top: 2px; }
  .c-main { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .hero2 { display: flex; align-items: flex-end; gap: 24px; padding: 18px 20px; }
  .hero2 h2 { font-size: 26px; }
  .hero2 .big { font-size: 44px; font-weight: 800; line-height: 1; }
  .hero2 .chg { font-size: 14px; font-weight: 700; }
  .bigchart { flex: 1; margin: 0 20px 14px; background: #F8FAFC; border: 1px solid #EEF2F7; border-radius: 8px; position: relative; }
  .tiles { display: flex; gap: 12px; padding: 0 20px 14px; }
  .tile { flex: 1; padding: 12px 14px; }
  .tile span { font-size: 11px; color: #98A2B3; }
  .tile b { display: block; font-size: 18px; margin-top: 4px; }

  .statusbar { height: 34px; background: #0F172A; color: #B9C2D0; display: flex; align-items: center; padding: 0 18px; font-size: 11px; margin-top: auto; }
  .statusbar .r { margin-left: auto; }
  svg { display: block; }
</style>
</head>
<body>
  <div class="titlebar"><div class="dot">A</div>股票涨跌提醒<span class="spacer">— □ ×</span></div>
  <div class="header" style="height:64px">
    <div class="brand"><div class="logo">A</div><div><h1>A股涨跌提醒</h1><p>每 5 秒检查行情 · 本地隐私优先</p></div></div>
    <div class="spacer"></div>
    <span class="chip muted" style="margin-right:10px">等待开盘</span>
    <span class="chip ok" style="margin-right:16px">AKShare · 正常</span>
    <div class="hbtn" style="margin-right:8px">继续监控</div>
    <div class="hbtn">设置</div>
  </div>
  <div class="c-body">
    <div class="card c-rail">
      <div style="padding:12px 14px;font-size:11px;color:#98A2B3;border-bottom:1px solid #E3E8EF">自选 4 只</div>
      <div class="railrow sel"><div><div class="n">中国船舶</div><div class="c">SH600150</div></div><div class="up" style="font-weight:700">+3.49%</div></div>
      <div class="railrow"><div><div class="n">恒瑞医药</div><div class="c">SH600276</div></div><div class="up" style="font-weight:700">+1.27%</div></div>
      <div class="railrow"><div><div class="n">万马股份</div><div class="c">SZ002276</div></div><div class="up" style="font-weight:700">+1.05%</div></div>
      <div class="railrow"><div><div class="n">紫金矿业</div><div class="c">SH601899</div></div><div class="up" style="font-weight:700">+2.27%</div></div>
    </div>
    <div class="c-main">
      <div class="card">
        <div class="hero2">
          <div style="flex:1">
            <span class="chip warn" style="float:right">等待开盘</span>
            <h2>中国船舶 <span class="muted" style="font-size:12px">SH600150 · 沪市</span></h2>
            <div style="display:flex;align-items:flex-end;gap:16px;margin-top:8px">
              <div class="big up">35.30</div>
              <div class="chg up" style="padding-bottom:6px">↑ +1.19　+3.49%</div>
            </div>
          </div>
        </div>
        <div class="bigchart" style="height:240px">
          <svg width="900" height="238">
            <line x1="0" y1="150" x2="900" y2="150" stroke="#E3E8EF" stroke-dasharray="4 4"/>
            <text x="8" y="144" font-size="10" fill="#98A2B3">昨收 34.11</text>
            <polyline points="20,200 140,180 260,160 380,120 500,100 620,80 740,70 880,66" fill="none" stroke="#D33A3A" stroke-width="2.5"/>
            <circle cx="880" cy="66" r="4" fill="#D33A3A"/>
          </svg>
        </div>
        <div class="tiles">
          <div class="card tile"><span>今开</span><b>34.20</b></div>
          <div class="card tile"><span>最高</span><b class="up">35.42</b></div>
          <div class="card tile"><span>最低</span><b class="down">34.02</b></div>
          <div class="card tile"><span>今日触发</span><b>0 次</b></div>
          <div class="card tile"><span>距上涨阈值</span><b class="up">已越过 0.49%</b></div>
        </div>
      </div>
    </div>
  </div>
  <div class="statusbar"><span>下一时段：今日 09:30</span><span class="r">AKShare（东方财富个股）· 更新成功</span></div>
</div>
.
</body>
</html>
</body>
</html>
